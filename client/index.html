<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the post page's bottom bar reach the screen edge on notched phones (it pads itself by the safe area). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The site name is filled in from site.config.ts, and %BRAND% (the logo's version) from logo.png (see vite.config.ts). -->
    <title>%SITE_NAME%</title>
    <!-- Made from the logo by the server (server/src/routes/pwa.ts). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png?v=%BRAND%" />
    <!-- Installable as an app (server/src/routes/pwa.ts). The status bar takes the theme's background (lib/theme.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=%BRAND%" />
    <meta name="apple-mobile-web-app-title" content="%SITE_NAME%" />
    <meta name="theme-color" content="#050918" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Applies the saved theme/language before React renders, so there's no flash of the wrong theme. Midnight is
      // the default. Opening the site at its home page shows the splash (below).
      (function () {
        var theme, lang;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark' && theme !== 'midnight') theme = 'midnight';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang === 'en' ? 'en' : 'ro';
        // Same colours as THEME_COLORS in src/lib/theme.ts.
        var color = { light: '#f5f3fb', dark: '#111017', midnight: '#050918' }[theme];
        document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
        if (location.pathname === '/') document.documentElement.classList.add('splash');
      })();
    </script>
    <style>
      /* The splash, when the site opens at its home page: the logo on the midnight theme's sky for at least 3 seconds
         (src/lib/splash.ts takes it away once the posts are there). Inline, so it's on screen from the first paint,
         before the app and its styles have loaded. */
      #splash {
        display: none;
      }

      .splash body {
        overflow: hidden;
      }

      .splash #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(1000px 600px at 15% -10%, rgb(88 70 220 / 0.22), transparent 60%),
          radial-gradient(800px 500px at 100% 10%, rgb(242 196 109 / 0.07), transparent 60%),
          #050918;
        touch-action: none;
        user-select: none;
      }

      /* The midnight theme's stars (--stars in src/styles/base.css), in two layers that twinkle in turn. */
      .splash-stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 25px 35px, rgb(255 255 255 / 0.8), transparent),
          radial-gradient(1px 1px at 140px 80px, rgb(255 255 255 / 0.6), transparent),
          radial-gradient(1.5px 1.5px at 210px 160px, rgb(255 236 190 / 0.8), transparent),
          radial-gradient(1px 1px at 70px 200px, rgb(255 255 255 / 0.5), transparent),
          radial-gradient(1px 1px at 180px 20px, rgb(255 255 255 / 0.6), transparent),
          radial-gradient(1.2px 1.2px at 100px 130px, rgb(200 210 255 / 0.7), transparent);
        background-size: 240px 240px;
        opacity: 0.6;
        animation: splash-twinkle 2.6s ease-in-out infinite alternate;
      }

      .splash-stars-2 {
        background-size: 330px 330px;
        background-position: 120px 70px;
        opacity: 0.15;
        animation-name: splash-twinkle-2;
      }

      /* A shooting star, as on the midnight theme's sky. */
      .splash-meteor {
        position: absolute;
        top: 16vh;
        left: 82vw;
        width: 170px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgb(255 236 190 / 0.35) 55%, rgb(255 255 255 / 0.95));
        transform-origin: left center;
        opacity: 0;
        animation: splash-meteor 1.8s linear 0.6s forwards;
      }

      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition: transform 0.5s ease;
      }

      .splash-logo {
        width: min(60vw, 280px);
        height: auto;
        filter: drop-shadow(0 0 26px rgb(242 196 109 / 0.25));
        animation:
          splash-logo-in 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both,
          splash-glow 2.2s ease-in-out 1.1s infinite alternate;
      }

      .splash-name {
        margin: 0;
        color: #f2c46d;
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(1.9rem, 8vw, 2.6rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-shadow: 0 0 24px rgb(242 196 109 / 0.35);
        animation: splash-rise 0.9s ease 0.45s both;
      }

      /* Fills in the 3 seconds. */
      .splash-progress {
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(242 196 109 / 0.18);
        animation: splash-rise 0.9s ease 0.6s both;
      }

      .splash-progress::after {
        content: '';
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #f2c46d, #ff9a62);
        transform: scaleX(0);
        transform-origin: left;
        animation: splash-fill 3s cubic-bezier(0.4, 0, 0.3, 1) forwards;
      }

      /* Leaving: it fades as the logo comes a little closer. */
      #splash.is-leaving {
        animation: splash-out 0.5s ease forwards;
      }

      #splash.is-leaving .splash-content {
        transform: scale(1.06);
      }

      @keyframes splash-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes splash-twinkle {
        to {
          opacity: 0.25;
        }
      }

      @keyframes splash-twinkle-2 {
        to {
          opacity: 0.5;
        }
      }

      @keyframes splash-meteor {
        0% {
          opacity: 0;
          transform: rotate(145deg) translateX(0);
        }
        10% {
          opacity: 1;
        }
        70%,
        100% {
          opacity: 0;
          transform: rotate(145deg) translateX(min(62vw, 560px));
        }
      }

      @keyframes splash-logo-in {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
      }

      @keyframes splash-glow {
        to {
          filter: drop-shadow(0 0 44px rgb(242 196 109 / 0.45));
        }
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      @keyframes splash-fill {
        to {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-stars,
        .splash-logo,
        .splash-name,
        .splash-progress {
          animation: none;
        }

        .splash-meteor {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- The splash (styles above). Away from the home page it's removed right here, before anything is painted. -->
    <div id="splash" aria-hidden="true">
      <div class="splash-stars"></div>
      <div class="splash-stars splash-stars-2"></div>
      <span class="splash-meteor"></span>
      <div class="splash-content">
        <img class="splash-logo" alt="" width="280" height="280" data-src="/icons/logo-480.webp?v=%BRAND%" />
        <p class="splash-name">%SITE_NAME%</p>
        <span class="splash-progress"></span>
      </div>
    </div>
    <script>
      (function () {
        var root = document.documentElement;
        var splash = document.getElementById('splash');
        if (!root.classList.contains('splash')) return splash.remove();
        var logo = splash.querySelector('img');
        logo.src = logo.getAttribute('data-src');
        // If the app never takes it away (it failed to load), it goes by itself.
        setTimeout(function () {
          if (!splash.isConnected) return;
          splash.classList.add('is-leaving');
          setTimeout(function () {
            root.classList.remove('splash');
            splash.remove();
          }, 600);
        }, 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
